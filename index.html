<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cthulhu Wars — The Stars Are Right</title>
  <meta name="description" content="A web-based digital implementation of the Cthulhu Wars board game with Solana wallet integration.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/main.css">
  <link rel="stylesheet" href="/src/css/map.css">
  <link rel="stylesheet" href="/src/css/ui.css">
  <link rel="stylesheet" href="/src/css/wallet.css">
  <link rel="stylesheet" href="/src/css/animations.css">
  <link rel="stylesheet" href="/src/css/profile.css">
</head>
<body>
  <div id="app">
    <!-- Global CA Banner -->
    <div id="global-banner" style="background: rgba(10, 10, 20, 0.9); color: #00e676; text-align: center; padding: 10px; font-family: 'Fira Code', monospace; font-size: 0.9rem; border-bottom: 1px solid #00e676; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 1000; position: relative;">
      <span>🪙 <strong>CA:</strong> ANohyVuF1cPGAVUNaX4wbuXV5ySPiUVwyaS1p3aDpump</span>
      <a href="https://github.com/sp3aker2020/cthulhu-wars" target="_blank" style="color: #448aff; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 5px;">
        <svg height="16" viewBox="0 0 16 16" version="1.1" width="16" aria-hidden="true" fill="currentColor"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
        GitHub
      </a>
    </div>

    <!-- Setup Screen (shown initially) -->
    <div id="setup-screen"></div>
    
    <!-- Game UI (hidden until game starts) -->
    <div id="game-ui" style="display:none">
      <!-- Header -->
      <header id="header">
        <div id="round-counter" class="mono">Round 1</div>
        <div id="phase-indicator">Setup</div>
        <div id="current-player"></div>
        <button id="map-mode-btn" class="rulebook-btn" style="border-color:#448aff;color:#448aff">🎥 3D Tabletop</button>
        <button id="rulebook-btn" class="rulebook-btn">📜 Rulebook</button>
        <div id="header-wallet"></div>
      </header>
      
      <!-- Main Area -->
      <main id="main-area">
        <div id="map-container"></div>
        <aside id="faction-panel" class="glass">
          <div id="player-tabs" class="player-tabs"></div>
          <div class="panel-section">
            <label class="panel-label">Power</label>
            <div class="power-display">
              <span id="power-value" class="power-value mono">0</span>
              <div class="power-meter"><div id="power-fill" class="power-meter-fill"></div></div>
            </div>
          </div>
          <div class="panel-section">
            <label class="panel-label">Doom</label>
            <div class="doom-display">
              <span id="doom-value" class="doom-counter mono">0</span>
              <div class="power-meter"><div id="doom-fill" class="power-meter-fill" style="background:linear-gradient(90deg,#880e4f,#ff1744)"></div></div>
            </div>
          </div>
          <div class="panel-section">
            <label class="panel-label">Units</label>
            <div id="unit-roster" class="unit-roster"></div>
          </div>
          <div class="panel-section">
            <label class="panel-label">Spellbooks</label>
            <div id="spellbook-list" class="spellbook-list"></div>
          </div>
        </aside>
      </main>
      
      <!-- Action Bar -->
      <div id="action-bar"></div>
      
      <!-- Game Log -->
      <div id="game-log" class="glass"></div>
    </div>
    
    <!-- Modals -->
    <div id="combat-modal"></div>
    <div id="selection-modal"></div>
    <div id="rulebook-modal"></div>
    <div id="phase-banner" style="display:none"></div>
    <div id="end-screen"></div>
    <div id="profile-page"></div>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
